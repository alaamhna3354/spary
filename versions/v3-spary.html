<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيق زبون سوق القطع</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Poppins:wght@700&display=swap">
<style>
/* Layout: a 390×844 phone on a cool-grey stage, Spary: Alaa's cards and Noto Kufi, with the proposed palette — identity green #0B5A4A, charcoal ink, burnt-orange actions, with a reference panel beside it that names the SRS clauses of the screen on show. */
:root{
  --ground:#E4E9E6; --surface:#FFFFFF; --surface-2:#F3F6F4; --line:#D8E0DC; --line-2:#E6ECE9;
  --ink:#1F2523; --ink-2:#46524D; --ink-3:#5B6762; --bezel:#1F2523;
  --brand:#0B5A4A; --brand-soft:#E3F0EB; --brand-line:#BBD6CC; --logo-a:#0B5A4A; --logo-b:#1F2523;
  --accent:#C2410C; --accent-hover:#A8380A; --accent-ink:#FFFFFF; --accent-soft:#FCE9DC; --accent-line:#F3C3A6;
  --imgbg:#EAF0ED; --offer:#C2410C; --offer-ink:#FFFFFF; --banner:#0B5A4A; --on-banner:#FFFFFF;
  --mode-shop:#FFFFFF; --mode-store:#1F2523; --mode-supply:#0B4A3D; --mode-supplier:#3B4250; --on-mode:#FFFFFF;
  --ok:#1D7348; --ok-soft:#E1F1E7; --warn:#8A5300; --warn-soft:#FFF0D3; --bad:#B42318; --bad-soft:#FCE6E3;
  --info:#1C5A9E; --info-soft:#E2EDF9; --feat:#6F4600; --feat-soft:#FFE6AE;
  --scrim:rgba(20,26,24,.5); --shadow:0 1px 2px rgba(31,37,35,.06),0 8px 24px rgba(31,37,35,.08); --shadow-xs:0 1px 2px rgba(31,37,35,.05);
  --f-display:"Noto Kufi Arabic",Tahoma,sans-serif;
  --f-body:"Noto Kufi Arabic",Tahoma,sans-serif;
  --r-s:10px; --r-m:16px; --r-l:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#080B0A; --surface:#151C1A; --surface-2:#0E1312; --line:#26302D; --line-2:#1C2422;
  --ink:#E8ECEA; --ink-2:#BAC4C0; --ink-3:#95A19C; --bezel:#020303;
  --brand:#3FB58C; --brand-soft:#10302A; --brand-line:#1E5446; --logo-a:#3FB58C; --logo-b:#E8ECEA;
  --accent:#F0793B; --accent-hover:#F59563; --accent-ink:#1B0D05; --accent-soft:#3A2216; --accent-line:#6A3A22;
  --imgbg:#1C2623; --offer:#F0793B; --offer-ink:#1B0D05; --banner:#0B4A3D; --on-banner:#FFFFFF;
  --mode-shop:#151C1A; --mode-store:#2A3532; --mode-supply:#0F5F4E; --mode-supplier:#4A5263; --on-mode:#FFFFFF;
  --ok:#5CC48C; --ok-soft:#163324; --warn:#F2B552; --warn-soft:#3A2B10; --bad:#F2877B; --bad-soft:#3D1A17;
  --info:#7DB2EE; --info-soft:#15283D; --feat:#F6CF7A; --feat-soft:#3A2E12;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --shadow-xs:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#080B0A; --surface:#151C1A; --surface-2:#0E1312; --line:#26302D; --line-2:#1C2422;
  --ink:#E8ECEA; --ink-2:#BAC4C0; --ink-3:#95A19C; --bezel:#020303;
  --brand:#3FB58C; --brand-soft:#10302A; --brand-line:#1E5446; --logo-a:#3FB58C; --logo-b:#E8ECEA;
  --accent:#F0793B; --accent-hover:#F59563; --accent-ink:#1B0D05; --accent-soft:#3A2216; --accent-line:#6A3A22;
  --imgbg:#1C2623; --offer:#F0793B; --offer-ink:#1B0D05; --banner:#0B4A3D; --on-banner:#FFFFFF;
  --mode-shop:#151C1A; --mode-store:#2A3532; --mode-supply:#0F5F4E; --mode-supplier:#4A5263; --on-mode:#FFFFFF;
  --ok:#5CC48C; --ok-soft:#163324; --warn:#F2B552; --warn-soft:#3A2B10; --bad:#F2877B; --bad-soft:#3D1A17;
  --info:#7DB2EE; --info-soft:#15283D; --feat:#F6CF7A; --feat-soft:#3A2E12;
  --scrim:rgba(0,0,0,.62); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --shadow-xs:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.price,.tnum{font-variant-numeric:tabular-nums}
[dir=rtl] .ltr,.ltr{direction:ltr;unicode-bidi:isolate}

/* stage */
.stage{display:grid;grid-template-columns:auto minmax(280px,380px);gap:32px;justify-content:center;align-items:start;max-width:1100px;margin:0 auto}
.device{width:390px;max-width:100%;height:844px;border:10px solid var(--bezel);border-radius:46px;overflow:hidden;position:relative;background:var(--surface-2);box-shadow:var(--shadow)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr);justify-items:center}.panel{width:100%;max-width:430px}}
@media (max-width:480px){.device{border:0;border-radius:var(--r-l);width:100%;height:calc(100dvh - 40px);min-height:560px}}

/* panel */
.panel{display:flex;flex-direction:column;gap:18px;font-size:14px;min-width:0}
.panel h1{font-family:var(--f-display);font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.panel .lede{color:var(--ink-2);margin:4px 0 0}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pbox h2{font-size:12px;letter-spacing:.04em;color:var(--ink-3);margin:0;font-weight:600}
.pbox select{width:100%;padding:9px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface-2)}
.refs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.refs li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.refs code{font-family:var(--f-display);font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;direction:ltr;white-space:nowrap}
.refs span{color:var(--ink-2);min-width:0}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:13px}
.jump button[aria-current=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pnote{font-size:13px;color:var(--ink-3);margin:0}

/* app shell */
.app{height:100%;display:flex;flex-direction:column;position:relative;background:var(--surface-2)}
.hdr{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--mode-shop);border-bottom:1px solid var(--line);min-height:58px}
.hdr .grow{flex:1;min-width:0}
.hdr h1{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr.m-store{background:var(--mode-store);color:var(--on-mode);border-color:transparent}
.hdr.m-supply{background:var(--mode-supply);color:var(--on-mode);border-color:transparent}
.hdr.m-supplier{background:var(--mode-supplier);color:var(--on-mode);border-color:transparent}
.wordmark{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:18px}
.wordmark i{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;position:relative;flex:none}
.ibtn:hover{background:var(--line-2)}
.hdr[class*="m-"] .ibtn:hover{background:rgba(255,255,255,.12)}
.ibtn .dot{position:absolute;top:5px;inset-inline-end:4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.rolepill{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;max-width:100%;min-width:0}
.rolepill .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rolepill .pend{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.hdr[class*="m-"] .rolepill{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:var(--on-mode)}
.rolepill small{font-weight:500;opacity:.8}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;scrollbar-width:thin}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px 10px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--ink-3);min-height:52px}
.tabs button[aria-current=page]{color:var(--accent);font-weight:600}
.ctabar{flex:none;display:flex;gap:10px;align-items:center;padding:12px 14px 16px;background:var(--surface);border-top:1px solid var(--line)}

/* type */
.h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0}
.h3{font-size:15px;font-weight:600;margin:0}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:13px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-m);border:1px solid transparent;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600}
.input{width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 14px;border-radius:var(--r-m);border:1.5px solid var(--ink);background:var(--surface);width:100%;text-align:start;color:var(--ink-3)}
.searchbox input{border:0;background:transparent;flex:1;min-width:0;outline:none;color:var(--ink);min-height:48px}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.badge.new{background:var(--info-soft);border-color:transparent;color:var(--info)}
.badge.used{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.badge.feat{background:var(--feat-soft);border-color:transparent;color:var(--feat)}
.badge.offer{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.badge.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.badge.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

/* part card */
.pcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:12px;background:var(--surface);border-bottom:1px solid var(--line-2);text-align:start;border-inline:0;border-top:0;width:100%}
.thumb{width:100%;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;background:var(--line-2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .t{font-weight:600;font-size:15px;line-height:1.4}
.pcard .fit{font-size:13px;color:var(--ink-2)}
.price{font-family:var(--f-display);font-weight:600;font-size:17px}
.price small{font-size:12px;font-weight:500;color:var(--ink-2)}
.strike{text-decoration:line-through;color:var(--ink-3);font-size:13px;font-family:var(--f-body)}
.seller{font-size:13px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stars{display:inline-flex;align-items:center;gap:2px;font-weight:600;color:var(--ink)}
.stars svg{color:#D99A00}
.mini{display:flex;flex-direction:column;gap:6px;width:150px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:8px;text-align:start}

/* blocks */
.blk{background:var(--surface);border-block:1px solid var(--line-2);padding:14px}
.blk + .blk{border-top:0;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.note{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:10px 12px;border-radius:var(--r-m);font-size:13.5px;line-height:1.5}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note b{color:inherit}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500}
.rows{display:flex;flex-direction:column}
.rowlink{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;background:var(--surface);border:0;border-bottom:1px solid var(--line-2);width:100%;text-align:start}
.rowlink .grow{flex:1;min-width:0}
.sum{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}
.sum.total{font-family:var(--f-display);font-weight:600;font-size:17px;padding-top:8px;border-top:1px dashed var(--line)}
.progress{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:3px}
table.offers{width:100%;border-collapse:collapse;font-size:13.5px}
table.offers th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
table.offers td{padding:10px 4px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.offers tr[aria-current=true] td{background:var(--accent-soft)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:36px;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* status */
.status-hero{padding:18px 14px;background:var(--surface);border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
.status-word{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.25}
.st-pending{color:var(--warn)}.st-alt{color:var(--bad)}.st-ok{color:var(--ok)}.st-ship{color:var(--info)}.st-fail{color:var(--bad)}.st-cancel{color:var(--ink-3)}
.track{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.track li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px;font-size:14px}
.track li::before{content:"";position:absolute;inset-inline-start:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1}
.track li.done .b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.track li.now .b{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.track li.todo{color:var(--ink-3)}
.timer{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;direction:ltr}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}
.otp input{width:46px;height:56px;text-align:center;font-family:var(--f-display);font-size:22px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--surface)}
.otp input:focus{border-color:var(--accent);outline:none}
.upl{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed var(--line);border-radius:var(--r-m);background:var(--surface);width:100%;text-align:start}
.upl.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.steps-top{display:flex;gap:6px}
.steps-top i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps-top i.on{background:var(--accent)}
.radio-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);width:100%;text-align:start}
.radio-row[aria-checked=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.radio-row .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.radio-row[aria-checked=true] .rd{border-color:var(--accent)}
.radio-row[aria-checked=true] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.radio-row[aria-disabled=true]{opacity:.7}

/* sheets & toast */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:40}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:88%;overflow-y:auto;padding:8px 16px 20px;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
.toast{position:absolute;inset-inline:16px;bottom:96px;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:var(--r-m);font-size:14px;z-index:60;box-shadow:var(--shadow)}
.gallery{position:relative;background:var(--line-2)}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.gallery .count{position:absolute;bottom:10px;inset-inline-start:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px}
.gallery .dots{position:absolute;bottom:12px;inset-inline:0;display:flex;justify-content:center;gap:5px}
.gallery .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.gallery .dots i.on{background:#fff}
.banner{border-radius:var(--r-m);padding:14px;background:var(--mode-store);color:var(--on-mode);display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;position:relative}
.banner .ad{position:absolute;top:8px;inset-inline-end:8px;font-size:10.5px;background:rgba(255,255,255,.18);padding:1px 6px;border-radius:4px}
.banner img{border-radius:10px;width:84px;height:84px;object-fit:cover}
.mode-ph{display:flex;flex-direction:column;gap:12px;padding:20px 16px}
.mode-ph ul{margin:0;padding-inline-start:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px}
.empty .ic{width:56px;height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* Spary skin (Alaa) — overrides on the shared components */
body{font-size:14px}
.btn{border-radius:var(--r-m);font-weight:700;font-size:14px}
.btn.pri:hover{background:var(--accent-hover)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.searchbox{border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-xs);color:var(--ink-3)}
.searchbox > svg{color:var(--accent)}
.rolepill{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.wordmark{color:var(--accent)}
.wordmark i{border-radius:10px}
.badge{border-radius:999px;font-size:11px;padding:1px 8px}
.badge.offer{background:var(--offer);color:var(--offer-ink);font-weight:700}
.price{color:var(--accent);font-weight:700}
.card{border-radius:var(--r-m);box-shadow:var(--shadow-xs)}
.sec-h .h2{display:flex;align-items:center;gap:8px}
.sec-h .h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent);flex:none}
.banner{background:var(--banner);color:var(--on-banner);border-radius:var(--r-l)}
.thumb{background:var(--imgbg);border-radius:12px}
.mini{border-radius:var(--r-m)}
.radio-row,.upl{border-radius:var(--r-m)}
.ecard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);text-align:start;box-shadow:var(--shadow-xs);min-width:0;width:100%}
.ecard.row{flex-direction:row;align-items:center;gap:10px}
.ecard .icn{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;margin-bottom:4px}
.ecard.row .icn{margin:0}
.ecard b{font-size:14.5px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
.pc{display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-xs);min-width:0}
.pc-open{display:flex;flex-direction:column;gap:5px;border:0;background:none;padding:0;text-align:start;min-width:0;width:100%;flex:1}
.pc-img{position:relative;border-radius:12px;overflow:hidden;background:var(--imgbg);aspect-ratio:1;max-width:100%}
.pc-img img{width:100%;height:100%;object-fit:cover;display:block}
.pc-tags{position:absolute;top:6px;inset-inline:6px;display:flex;justify-content:space-between;gap:4px}
.pc .t{font-weight:700;font-size:13.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .fit{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pc .seller{font-size:11.5px;min-width:0}
.pc .badges .badge{font-size:10.5px}
.pc-add{min-height:40px;border-radius:12px;font-size:13px;padding:0 10px}
.hscroll .pc{width:172px;flex:none}
.scard{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow-xs)}
.scard .top{display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:start;width:100%}
.scard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.svc-list{display:flex;flex-direction:column;gap:10px;padding:12px}

/* proposed palette: green carries identity and selection, orange only the main action and deals */
:focus-visible{outline-color:var(--brand)}
.wordmark{direction:ltr;gap:8px}
.wordmark .wm{font-family:"Poppins","Segoe UI",sans-serif;font-weight:700;font-size:23px;letter-spacing:-.01em;color:var(--logo-a);line-height:1}
.rolepill{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.price{color:var(--brand)}
.link{color:var(--brand)}
.tabs button[aria-current=page]{color:var(--brand)}
.sec-h .h2::before{background:var(--brand)}
.ecard .icn{background:var(--brand-soft);color:var(--brand)}
.searchbox > svg{color:var(--brand)}
.radio-row[aria-checked=true]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.radio-row[aria-checked=true] .rd{border-color:var(--brand)}
.radio-row[aria-checked=true] .rd::after{background:var(--brand)}
.steps-top i.on{background:var(--brand)}
.track li.now .b{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.otp input:focus{border-color:var(--brand)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-banner)}

const norm = s => String(s).toLowerCase().replace(/[ًٌٍَُِّْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();

const modelOf = (mk, md) => makeOf(mk)?.models.find(m => m.id === md);

function parse(text){
  const t = ' ' + norm(text) + ' ', r = {text, part:null, typed:null, amb:[], mk:null, md:null, year:null, oem:null};
  let best = 0, hits = [];
  NAMES.forEach(x => [x.name, ...x.alt].forEach(al => { const n = norm(al); if (n.length >= 2 && (n.length > 3 ? t.includes(n) : t.includes(' ' + n + ' '))){ if (n.length > best){ best = n.length; hits = [[x.id, al]]; } else if (n.length === best && !hits.some(h => h[0] === x.id)) hits.push([x.id, al]); } }));
  if (hits.length === 1){ r.part = hits[0][0]; r.typed = hits[0][1]; } else if (hits.length > 1){ r.amb = hits.map(h => h[0]); r.typed = hits[0][1]; }
  MAKES.forEach(m => { if (t.includes(norm(m.name))) r.mk = m.id; m.models.forEach(md => [md.name, ...md.alt].forEach(al => { if (t.includes(' ' + norm(al) + ' ') || t.includes(norm(al) + ' ')) { r.mk = m.id; r.md = md.id; } })); });
  const y = text.match(/\b(19[89]\d|20[0-2]\d)\b/); if (y) r.year = +y[1];
  const o = text.match(/\b[A-Z0-9]{4,6}-[A-Z0-9]{3,6}\b/i); if (o) r.oem = o[0].toUpperCase();
  return r;
}

      <div class="rows card" style="padding:0;overflow:hidden;margin:0 14px 14px">${row('box','طلباتي',a('tab','orders'))}${row('pin','عناويني',a('sheet','addrs'),S.addresses.length + ' عناوين محفوظة')}${row('globe','اللغة',a('sheet','lang'),'العربية')}${row('help','الأسئلة الشائعة والشكاوى',a('go','help'))}${row('chat','الدعم عبر واتساب',a('support'))}${row('shield','الخصوصية وبياناتي',a('sheet','privacy'))}${row('logout','الخروج من كل الأجهزة',a('logoutAll'))}${row('logout','تسجيل الخروج',a('logout'))}</div>`;
  }};
function loginFrom(s){ S.pendingAfterLogin = [s]; go('login'); }
function logout(){ S.persona = 'guest'; S.extraCaps = []; S.role = 'shop'; tab('home'); toast('سجّلت الخروج'); }
function logoutAll(){ toast('خرجت من كل أجهزتك؛ هذا الجهاز يطلب الكود من جديد'); }
SHEETS.addrs = { label:'عناويني', render(){ return `<h2 class="h2">عناويني</h2>${S.addresses.map(x => `<div class="card" style="display:flex;gap:8px;align-items:flex-start"><span style="flex:1"><b>${x.label}</b><br><span class="faint">${x.gov}، ${x.area} — ${x.detail}</span></span><button class="ibtn" ${a('editAddr')} aria-label="عدّل">${ic('doc',18)}</button><button class="ibtn" ${a('delAddr',x.id)} aria-label="احذف">${ic('trash',18)}</button></div>`).join('')}<button class="btn sec block" ${a('sheet','addr')}>${ic('plus',18)} أضف عنوانًا</button>`; }};
function editAddr(){ sheet('addr'); }
function delAddr(id){ S.addresses = S.addresses.filter(x => x.id !== id); render(); }
SHEETS.lang = { label:'اللغة', render(){ return `<h2 class="h2">اللغة</h2><button class="radio-row" role="radio" aria-checked="true" ${a('close')}><span class="rd"></span><span>العربية</span></button><button class="radio-row" role="radio" aria-checked="false" ${a('enNote')}><span class="rd"></span><span lang="en" dir="ltr">English</span></button><p class="faint" style="margin:0">ما يكتبه التجّار يبقى بلغته كما كتبوه.</p>`; }};
function enNote(){ S.sheet = null; render(); toast('النموذج بالعربية؛ الواجهة الإنكليزية من اليسار لليمين تُرسم بعد اعتماد هذه'); }
SHEETS.privacy = { label:'الخصوصية', render(){ return `<h2 class="h2">الخصوصية وبياناتي</h2>
  <button class="rowlink" style="border:1px solid var(--line);border-radius:12px" ${a('expReq')}>${ic('doc')}<span class="grow">اطلب نسخة من بياناتي<br><span class="faint">تجهّزها الإدارة وتصلك بصيغة مقروءة</span></span></button>
  <button class="rowlink" style="border:1px solid var(--line);border-radius:12px;color:var(--bad)" ${a('delReq')}>${ic('trash')}<span class="grow">احذف حسابي<br><span class="faint">لا يتم الحذف وعليك طلب قائم؛ أغلِقه أولًا</span></span></button>`; }};
function expReq(){ S.sheet = null; render(); toast('وصل طلبك للإدارة'); }
function delReq(){ S.sheet = null; render(); toast('عندك طلب قائم (JO-24817). يُحذف الحساب بعد إغلاقه'); }

/* ---------- role switch (ACC-7) ---------- */
SHEETS.role = { label:'تبديل الصفة', render(){
  const cs = caps(), st = cap('store'), sp = cap('supplier'), sv = cap('service');
  const r = (role, icn, t, sub, extra='') => `<button class="radio-row" role="radio" aria-checked="${S.role === role}" ${a('role',role)} ${extra}><span class="rd"></span><span style="flex:1"><b>${t}</b><br><span class="faint">${sub}</span></span>${ic(icn,20)}</button>`;
  const off = (t, sub, act) => `<button class="radio-row" aria-disabled="true" ${act}><span class="rd" style="border-style:dashed"></span><span style="flex:1"><b>${t}</b><br><span class="faint">${sub}</span></span>${ic('chev',18)}</button>`;
  return `<h2 class="h2">تعمل الآن بصفة…</h2><div class="stack" style="gap:8px" role="radiogroup">
    ${r('shop','cart','أتسوّق لنفسي','طلباتك وعناوينك وسلّتك الشخصية')}
    ${st?.st === 'active' ? r('store','store','أدير متجري', ME.store + ' · قطعك وطلبات الزبائن') + r('supply','supply','أطلب من مورّد','مشتريات الجملة لـ' + ME.store) : ''}
    ${st?.st === 'pending' ? off(ME.store + ' — قيد المراجعة','تفتح واجهة المتجر بعد قبول الإدارة · تابع الحالة', a('go','joinStatus')) : ''}
    ${st?.st === 'rejected' ? off('طلب المتجر لم يُقبل','اعرف السبب وأعد التقديم', a('go','joinStatus')) : ''}
    ${sp?.st === 'active' ? r('supplier','supply','أدير توريدي', ME.supplier + ' · أصنافك وطلبات التجّار') : ''}
    ${sp?.st === 'pending' ? off(ME.supplier + ' — قيد المراجعة','تفتح واجهة المورّد بعد قبول الإدارة', a('go','joinStatus')) : ''}
    ${sv ? r('service','wrench','أدير إعلاناتي','إعلانات خدمتك واشتراكها') : ''}</div>
    ${sp && !st ? note('info','info','<b>الزبائن لا يرون الموردين.</b> لتبيع لهم افتح متجر تاجر على حسابك نفسه، وتبقى موردًا.') : ''}
    <div class="stack" style="gap:6px"><span class="faint">أضف صفة لحسابك</span><div class="chips">${!st ? `<button class="chip" ${a('startJoin','store')}>${ic('store',16)} افتح متجرك</button>` : ''}${!sp ? `<button class="chip" ${a('startJoin','supplier')}>${ic('supply',16)} سجّل كمورّد</button>` : ''}${!sv ? `<button class="chip" ${a('startJoin','service')}>${ic('wrench',16)} أعلن عن خدمتك</button>` : ''}</div></div>`;
}};
ROLE.service = {ic:'wrench', lbl:'إعلاناتي', small:'مزوّد خدمة', short:'إعلاناتي', cls:'m-supply'};
const MODE_TXT = {
  store:['واجهة المتجر', [['إضافة القطع وصورها وحالتها','CAT-2…9'],['طلبات الزبائن وتأكيدها خلال المهلة','ORD-4/5'],['العروض على القطع','OFR-1'],['التوصيل المجاني من المتجر','DLV-11'],['الاشتراك والباقة','SUB-1…9']]],
  supply:['الطلب من الموردين', [['بضاعة الموردين وأسعارهم — للتاجر المقبول وحده','SUP-2, ACC-1'],['الحدّ الأدنى وشرائح الكمية لكل صنف','SUP-3'],['شريط خصومات الموردين','SUP-6']]],
  supplier:['واجهة المورّد', [['أصنافك وحدّها الأدنى وشرائحها','SUP-3'],['طلبات التجّار: قبول أو اعتذار','SUP-4'],['الخصومات ومدّتها','SUP-6'],['الاشتراك','SUB-7']]],
  service:['إعلانات الخدمة', [['إضافة الإعلان وتعديله','SVC-2/3'],['الاشتراك شرط لظهور الإعلان','SVC-6']]],
};
SCREENS.mode = { title:() => MODE_TXT[S.role][0],
  refs:() => [['ACC-7','الصفة ظاهرة في الرأس بلونها واسمها، والعودة من الشارة نفسها'],['SEC-2','بيانات الموردين تُحجب على مستوى الخادم'],['—','هذه الواجهة تُصمَّم في دفعة لاحقة؛ هنا تُثبت الانتقال فقط']],
  render(){ const [t, items] = MODE_TXT[S.role];
    return `<div class="mode-ph"><h2 class="h2" style="font-size:22px">${t}</h2><p class="muted" style="margin:0">تُصمَّم في الدفعة التالية. ستضمّ:</p>
      <ul>${items.map(([x, r]) => `<li>${x} <span class="faint ltr">${r}</span></li>`).join('')}</ul>
      ${note('ok','check','سلّتك الشخصية وطلباتك محفوظة كما هي. ارجع لها من الشارة في الأعلى.')}
      <button class="btn sec block" ${a('role','shop')}>${ic('cart',18)} ارجع: أتسوّق لنفسي</button></div>`; }};

/* ---------- open your store (join) ---------- */
S.extraCaps = [];
function startJoin(t){ if (needLogin(['join'])) return; S.join = {type:t || null, step:t ? 1 : 0, files:{}, terms:false}; go('join'); }
const JOIN_T = {store:['افتح متجرك','تبيع قطعك للزبائن. يحتاج قبول الإدارة.'], supplier:['سجّل كمورّد','تبيع للتجّار بالجملة، ولا يراك الزبائن. يحتاج قبول الإدارة.'], service:['أعلن عن خدمتك','ونش، كراج، غسيل… بلا أوراق. يظهر إعلانك بعد تفعيل الاشتراك.']};
SCREENS.join = { title:() => S.join.type ? JOIN_T[S.join.type][0] : 'أضف صفة لحسابك', noCart:true,
  refs:[['ACC-4','الحساب نفسه برقمه، تُضاف إليه صفة تاجر أو مورّد أو مزوّد خدمة'],['ACC-6','صفة التاجر والمورّد لا تُفعَّل إلا بعد قبول الإدارة'],['ACC-8','السجلّ التجاري، الهوية، صورة المحل — تُرفع من التطبيق'],['ACC-10','مزوّد الخدمة بلا أوراق'],['ACC-11','الموافقة على شروط صاحب المشروع داخل التطبيق'],['ACC-12','المورّد يفتح متجر تاجر ليبيع للزبون'],['SEC-5','الأوراق في مساحة خاصة بروابط مؤقتة']],
  render(){
    const j = S.join, steps = j.type === 'service' ? 2 : 3;
    if (j.step === 0) return `<div class="pad stack" style="gap:12px"><p class="muted" style="margin:0">على حسابك نفسه ورقمك نفسه. تبقى زبونًا، وتُضاف لك صفة جديدة.</p>
      ${Object.entries(JOIN_T).map(([k, [t, s]]) => { const has = cap(k); return `<button class="radio-row" ${has ? 'aria-disabled="true" disabled' : ''} ${a('joinType',k)}>${ic(k === 'store' ? 'store' : k === 'supplier' ? 'supply' : 'wrench',24)}<span style="flex:1"><b>${t}</b><br><span class="faint">${has ? 'موجودة على حسابك' : s}</span></span>${ic('chev',18)}</button>`; }).join('')}
      ${cap('supplier') && !cap('store') ? note('info','info','أنت مورّد. لتبيع للزبائن مباشرة افتح متجر تاجر هنا، على حسابك نفسه.') : ''}</div>`;
    const bar = `<div class="steps-top" aria-label="الخطوة ${j.step} من ${steps}">${Array.from({length:steps}, (_, i) => `<i class="${i < j.step ? 'on' : ''}"></i>`).join('')}</div>`;
    let body;
    if (j.step === 1 && j.type !== 'service') body = `<h2 class="h2">بيانات ${j.type === 'store' ? 'المتجر' : 'المؤسسة'}</h2>
      <div class="field"><label for="j-n">${j.type === 'store' ? 'اسم المتجر' : 'اسم المؤسسة'}</label><input id="j-n" class="input" value="${j.type === 'store' ? ME.store : ME.supplier}"></div>
      <div class="field"><label for="j-g">المحافظة</label><select id="j-g" class="input">${GOVS.map(g => `<option ${g === 'الزرقاء' ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
      <div class="field"><label for="j-a">المنطقة</label><input id="j-a" class="input" value="الهاشمية"></div>
      <div class="field"><label for="j-p">هاتف ${j.type === 'store' ? 'المتجر' : 'المؤسسة'}</label><input id="j-p" class="input ltr tnum" value="079 000 4821"><span class="faint">${j.type === 'store' ? 'يظهر في صفحة متجرك ليتصل بك الزبون.' : 'يظهر للتجّار المقبولين فقط.'}</span></div>`;
    if (j.step === 1 && j.type === 'service') body = `<h2 class="h2">بيانات الخدمة</h2>
      <button class="upl ${j.files.photo ? 'done' : ''}" ${a('upl','photo')}>${ic(j.files.photo ? 'check' : 'upload')}<span><b>صورة المحل</b><br><span class="faint">${j.files.photo ? 'رُفعت' : 'من الكاميرا أو المعرض'}</span></span></button>
      <div class="field"><label for="j-t">نوع الخدمة</label><select id="j-t" class="input">${SVC_TYPES.map(t => `<option>${t}</option>`).join('')}</select></div>
      <div class="field"><label for="j-l">الموقع</label><input id="j-l" class="input" value="الزرقاء — الهاشمية"></div>
      <div class="field"><label for="j-i">معلومات عن الخدمة</label><input id="j-i" class="input" placeholder="مثل: سحب داخل الزرقاء على مدار الساعة"></div>
      <div class="field"><label for="j-f">نصّ حرّ</label><textarea id="j-f" class="input" rows="3"></textarea></div>`;
    if (j.step === 2 && j.type !== 'service') body = `<h2 class="h2">الأوراق</h2><p class="muted" style="margin:0">تراها الإدارة وحدها لقبول طلبك.</p>
      ${[['cr','السجلّ التجاري'],['id','الهوية'],['shop','صورة المحل']].map(([k, t]) => `<button class="upl ${j.files[k] ? 'done' : ''}" ${a('upl',k)}>${ic(j.files[k] ? 'check' : 'upload')}<span><b>${t}</b><br><span class="faint">${j.files[k] ? 'رُفعت · اضغط للتبديل' : 'صورة أو PDF'}</span></span></button>`).join('')}`;
    if (j.step === steps) body = `<h2 class="h2">الشروط</h2><div class="card" style="max-height:180px;overflow:auto;background:var(--surface-2)"><p class="faint" style="margin:0">[نصّ شروط البيع والإعلان — يكتبه صاحب المشروع]</p></div>
      <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="j-terms" ${j.terms ? 'checked' : ''} style="width:20px;height:20px;margin-top:3px"> أوافق على الشروط</label>
      ${j.type !== 'service' ? note('info','info','بعد الإرسال تراجع الإدارة طلبك. تبقى تتسوّق كالعادة، وتصلك رسالة بالقرار.') : note('info','info','يظهر إعلانك للزبائن بعد تفعيل اشتراكك من الإدارة.')}`;
    return `<div class="pad stack" style="gap:14px">${bar}${body}</div>`;
  },
  cta(){ const j = S.join; if (!j.step) return ''; const steps = j.type === 'service' ? 2 : 3, last = j.step === steps;
    const ok = j.type !== 'service' && j.step === 2 ? ['cr','id','shop'].every(k => j.files[k]) : true;
    return `<div class="ctabar"><button class="btn pri block" ${ok ? '' : 'disabled'} ${a(last ? 'joinSend' : 'joinNext')}>${last ? 'أرسل الطلب' : 'التالي'}</button></div>`; }};
function joinType(t){ S.join.type = t; S.join.step = 1; render(true); }
function joinNext(){ S.join.step++; render(true); }
function upl(k){ S.join.files[k] = true; render(); }
document.addEventListener('change', e => { if (e.target.id === 'j-terms') S.join.terms = e.target.checked; });
function joinSend(){ if (!S.join.terms) return toast('الموافقة على الشروط مطلوبة');
  const t = S.join.type; S.extraCaps = S.extraCaps.filter(c => c.t !== t); S.extraCaps.push({t, st:t === 'service' ? 'active' : 'pending'});
  S.stack = []; if (t === 'service'){ S.screen = 'account'; render(true); return toast('أُضيفت صفة مزوّد خدمة لحسابك'); }
  S.screen = 'joinStatus'; S.params = []; render(true); }
SCREENS.joinStatus = { title:'حالة طلبك', noCart:true,
  refs:[['ACC-6','لا تُفعَّل الصفة قبل قبول الإدارة'],['ACC-9','المرفوض يُبلَّغ بالسبب، وله أن يقدّم مرة أخرى'],['ACC-7','الصفة قيد المراجعة تظهر في قائمة الصفات معطّلة']],
  render(){
    const c = caps().find(x => x.st !== 'active') || {t:'store', st:'pending'}, name = c.t === 'store' ? ME.store : ME.supplier;
    if (c.st === 'rejected') return `<div class="status-hero"><div class="status-word st-alt">لم يُقبل طلبك</div><p class="muted" style="margin:0">${name}</p></div>
      <div class="pad stack" style="gap:12px"><div class="card stack" style="gap:6px"><b>سبب الإدارة</b><p style="margin:0">صورة السجلّ التجاري غير واضحة، والاسم فيها لا يطابق اسم المتجر.</p></div>
      <button class="btn pri block" ${a('reapply')}>عدّل وأعد التقديم</button></div>`;
    return `<div class="status-hero"><div class="status-word st-pending">قيد المراجعة</div><p class="muted" style="margin:0">طلب ${c.t === 'store' ? 'فتح متجر' : 'التسجيل كمورّد'}: <b>${name}</b></p></div>
      <div class="blk"><ol class="track"><li class="done"><span class="b">${ic('check',12)}</span><span>أرسلت البيانات والأوراق</span></li><li class="now"><span class="b"></span><span>مراجعة الإدارة</span></li><li class="todo"><span class="b"></span><span>القبول وفتح ${c.t === 'store' ? 'واجهة المتجر' : 'واجهة المورّد'}</span></li></ol></div>
      <div class="pad stack" style="gap:12px"><div class="card stack" style="gap:6px"><b>ما أرسلته</b>${['السجلّ التجاري','الهوية','صورة المحل'].map(x => `<div style="display:flex;gap:6px;align-items:center">${ic('check',16)} ${x}</div>`).join('')}</div>
      ${note('info','info','تصلك رسالة بالقرار. خلال المراجعة تتسوّق كالعادة.')}<button class="btn sec block" ${a('tab','home')}>تابع التسوّق</button></div>`;
  }};
function reapply(){ S.join = {type:'store', step:2, files:{}, terms:false}; go('join'); }

/* ---------- start ---------- */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
render();
</script>
</body>
</html>
