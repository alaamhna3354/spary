<!doctype html>
<html lang="ar" dir="rtl" data-palette="volt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111c20">
  <title>Spary — الرئيسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/home-sections.css">
  <link rel="stylesheet" href="assets/home.css">
  <link rel="stylesheet" href="assets/typography.css">
  
  
</head>
<body>
  <main class="presentation" aria-label="معاينة تطبيق Spary">
    <aside id="roles" class="roles" aria-label="أدوار المعاينة"></aside>
    <div class="device" id="device">
      <div id="app" class="app">
        <div id="screen" class="screen"></div>
        <nav id="dock" class="dock" aria-label="التنقل الرئيسي"></nav>
        <div id="toast" class="toast" role="status" hidden></div>
      </div>
    </div>
  </main>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-top">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" id="sheet-close" aria-label="إغلاق"></button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </dialog>

  <script src="assets/catalog.js"></script>
  <script src="assets/identity.js"></script>
  <script src="assets/whatsapp.js"></script>
  <script src="assets/home-sections.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/type-scale.js"></script>
</body>
</html>
