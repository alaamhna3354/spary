<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spary — الرئيسية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800&family=Noto+Kufi+Arabic:wght@400;500;700&family=Poppins:wght@600;700&display=swap">
<style>
/* Layout: phone home page. A navy "workshop band" carries the logo, made of the logo's hex-nut, with the ad banner hanging off its edge;
   the hero is a search that translates Jordanian street names into official part names. Panel beside it: versions, controls, SRS clauses. */
:root{
  --ground:#E8EEF4; --bg:#F7F9FC; --surface:#FFFFFF; --surface-2:#EDF3F9; --line:#C4D0DC;
  --ink:#001F3F; --ink-2:#45566B; --ink-3:#718398;
  --brand:#001F3F; --brand-deep:#173B5D; --brand-soft:#E8F0F7; --mint:#FF851B;
  --band:#001F3F; --band-ink:#FFFFFF; --band-ink-2:#D8E4EE; --hex:rgba(255,255,255,.07);
  --accent:#FF851B; --accent-hover:#D96D00; --accent-ink:#FFFFFF; --accent-soft:#FFF0DF;
  --plate:#E4ECF3; --plate-line:#B6C7D6; --rivet:#718398;
  --slide-1:#173B5D; --slide-2:#001F3F; --slide-3:#B54700; --on-slide:#FFFFFF;
  --on-brand:#FFFFFF; --ok:#0B7A53; --scrim:rgba(0,31,63,.5);
  --shadow:0 1px 2px rgba(0,31,63,.06),0 10px 28px rgba(0,31,63,.10); --shadow-xs:0 1px 2px rgba(0,31,63,.06);
  --f-display:"Alexandria","Noto Kufi Arabic",Tahoma,sans-serif;
  --f-body:"Noto Kufi Arabic",Tahoma,sans-serif;
  --f-num:"Poppins","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#071726; --bg:#0B2238; --surface:#102A43; --surface-2:#173B5D; --line:#2E4B63;
  --ink:#E9F1F8; --ink-2:#C2D0DD; --ink-3:#9BAEC0;
  --brand:#9BC7EF; --brand-deep:#173B5D; --brand-soft:#173B5D; --mint:#FFB76B;
  --band:#00152A; --band-ink:#FFFFFF; --band-ink-2:#CFE0ED; --hex:rgba(255,255,255,.06);
  --accent:#FF9C45; --accent-hover:#FFB66E; --accent-ink:#001F3F; --accent-soft:#4A2C18;
  --plate:#1C3349; --plate-line:#3D5C73; --rivet:#6F8799;
  --slide-1:#173B5D; --slide-2:#102A43; --slide-3:#8A3A12; --on-slide:#FFFFFF;
  --on-brand:#001F3F; --ok:#5CC48C; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); --shadow-xs:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#071726; --bg:#0B2238; --surface:#102A43; --surface-2:#173B5D; --line:#2E4B63;
  --ink:#E9F1F8; --ink-2:#C2D0DD; --ink-3:#9BAEC0;
  --brand:#9BC7EF; --brand-deep:#173B5D; --brand-soft:#173B5D; --mint:#FFB76B;
  --band:#00152A; --band-ink:#FFFFFF; --band-ink-2:#CFE0ED; --hex:rgba(255,255,255,.06);
  --accent:#FF9C45; --accent-hover:#FFB66E; --accent-ink:#001F3F; --accent-soft:#4A2C18;
  --plate:#1C3349; --plate-line:#3D5C73; --rivet:#6F8799;
  --slide-1:#173B5D; --slide-2:#102A43; --slide-3:#8A3A12; --on-slide:#FFFFFF;
  --on-brand:#001F3F; --ok:#5CC48C; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); --shadow-xs:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;margin: 0;}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* stage + panel */
.stage{display:grid;grid-template-columns:auto minmax(280px,360px);gap:32px;justify-content:center;align-items:start;max-width:1100px;margin:0 auto}
.device{width:390px;max-width:100%;height:844px;border:10px solid #141917;border-radius:48px;overflow:hidden;position:relative;background:var(--bg);box-shadow:var(--shadow)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr);justify-items:center}.panel{width:100%;max-width:430px}}
@media (max-width:480px){.device{border:0;border-radius:20px;width:100%;height:calc(100dvh - 40px);min-height:600px}}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h1{font-family:var(--f-display);font-size:22px;font-weight:800;margin:0;line-height:1.35;text-wrap:balance}
.panel p{margin:0}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pbox h2{font-size:12px;letter-spacing:.03em;color:var(--ink-3);margin:0;font-weight:700}
.vers{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.vers a,.vers span{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none}
.vers a:hover{border-color:var(--brand)}
.vers .cur{background:var(--brand-soft);border-color:var(--brand);font-weight:700}
.vers small{color:var(--ink-3);font-weight:400}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:36px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow-xs)}
.refs{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.refs li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.refs code{font-family:var(--f-num);font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;direction:ltr;white-space:nowrap}
.refs span{color:var(--ink-2);min-width:0}
.pnote{font-size:12.5px;color:var(--ink-3)}

/* app */
.app{height:100%;position:relative;background:var(--bg);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding-bottom:104px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* the band */
.band{background-color:var(--band);color:var(--band-ink);padding:0 16px 70px;position:relative;
  background-size:56px 48px;background-blend-mode:normal}
.band > *{position:relative;z-index:1}
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 16px 10px;margin:0 -16px;background:var(--band)}
.logo{display:flex;align-items:center;gap:8px;direction:ltr;flex:1}
.logo .wm{font-family:var(--f-num);font-weight:700;font-size:25px;letter-spacing:-.01em;color:var(--mint);line-height:1}
.logo .wm b{color:var(--band-ink);font-weight:700}
.ibtn{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:var(--band-ink);display:grid;place-items:center;position:relative;flex:none}
.ibtn:hover{background:rgba(255,255,255,.2)}
.ibtn .dot{position:absolute;top:-3px;inset-inline-end:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 11px/20px var(--f-num);padding:0 5px;border:2px solid var(--band)}
.rolepill{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:var(--band-ink);font-weight:700;font-size:13px}
.loc{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--band-ink-2);padding:4px 0 0;font-size:13px}
.loc b{color:var(--band-ink)}

/* banner hanging off the band */
.bnr{margin:-58px 16px 0;position:relative;z-index:2}
.bnr-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;box-shadow:var(--shadow);scrollbar-width:none}
.bnr-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;min-height:148px;display:block;padding:0;color:var(--on-slide);position:relative;overflow:hidden;border:0;text-align:start;background:var(--slide-1)}
.slide > span:not(.ad){position:absolute;top:12px;right:22px;bottom:12px;z-index:2;width:min(45%,210px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;transform:none;text-align:right}
.slide .st1{display:block;align-self:stretch;font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.25;margin:0 0 5px;text-wrap:balance}
.slide .st2{display:block;align-self:stretch;margin:0;font-size:11.25px;line-height:1.4;opacity:.88}
.slide .cta{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-weight:700;font-size:11.5px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px}
.slide img{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;border-radius:0;transform:none;box-shadow:none}
.slide .ad{position:absolute;top:10px;inset-inline-end:12px;z-index:3;font-size:10.5px;background:rgba(0,0,0,.28);padding:1px 7px;border-radius:5px}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.dots button{width:7px;height:7px;border-radius:4px;border:0;padding:0;background:var(--line);transition:width .25s}
.dots button[aria-current=true]{width:22px;background:var(--brand)}

/* hero search */
.sec{padding:22px 16px 0}
.hero-t{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
.hero-t em{font-style:normal;color:var(--brand)}
.hero-s{margin:4px 0 14px;color:var(--ink-2)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:6px 6px 6px 8px;box-shadow:var(--shadow-xs);position:relative;transition:border-color .2s}
.sbox:focus-within{border-color:var(--brand)}
.sbox > svg{flex:none;color:var(--brand);margin-inline-start:6px}
.sfield{position:relative;flex:1;min-width:0;height:44px}
.sfield input{position:absolute;inset:0;width:100%;border:0;background:transparent;outline:none;font-size:15px;color:var(--ink)}
.ghost{position:absolute;inset:0;display:flex;align-items:center;font-size:15px;color:var(--ink-3);pointer-events:none;white-space:nowrap;overflow:hidden}
.ghost i{display:inline-block;width:2px;height:20px;background:var(--brand);margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.xl8{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:36px;margin-top:10px}
.xl8 .said{font-weight:700;color:var(--ink)}
.xl8 .arr{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.part{background:var(--brand);color:var(--on-brand)}
.pill.car{background:var(--brand-soft);color:var(--brand)}
.pill.oem{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-family:var(--f-num)}
.xl8 .lbl{font-size:12px;color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){.xl8 > *{animation:pop .35s ease-out both}.xl8 > *:nth-child(2){animation-delay:.06s}.xl8 > *:nth-child(3){animation-delay:.12s}.xl8 > *:nth-child(4){animation-delay:.18s}.xl8 > *:nth-child(5){animation-delay:.24s}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}}}
.go-row{display:flex;justify-content:flex-end}
.go-row button{border:0;background:none;color:var(--brand);font-weight:700;padding:6px 0}

/* entry tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;text-align:start;min-width:0;box-shadow:var(--shadow-xs)}
.tile:hover{border-color:var(--brand)}
.hexi{width:42px;height:38px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.tile b{font-size:15px;line-height:1.3}
.tile .sub{font-size:12px;color:var(--ink-3);line-height:1.4}
.makes{display:flex;gap:4px;flex-wrap:wrap}
.makes span{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.plate{width:100%;background:var(--plate);border:1px solid var(--plate-line);border-radius:8px;padding:6px 18px;position:relative;direction:ltr;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11.5px;letter-spacing:.09em;color:var(--ink);white-space:nowrap;overflow:hidden}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--rivet)}
.plate::before{left:6px}.plate::after{right:6px}
.plate small{display:block;font-size:8.5px;letter-spacing:.2em;color:var(--ink-3)}
.plate .rest{color:var(--ink-3)}

/* trust strip */
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px 16px 0}
.trust div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:10px 4px;border-radius:14px;background:var(--surface-2)}
.trust svg{color:var(--brand)}

/* section heads */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:26px 16px 10px}
.sh h2{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0;display:flex;align-items:center;gap:8px}
.sh h2::before{content:"";width:10px;height:9px;background:var(--brand);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex:none}
.sh button{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px;padding:6px 0}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}

/* offer card: clear product, price comparison, and one decisive action */
.oc{flex:0 0 242px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-xs);min-width:0}
.oc-open{display:flex;flex-direction:column;gap:8px;width:100%;border:0;background:none;padding:0;text-align:start;min-width:0;color:var(--ink)}
.oc-img{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1.35;background:var(--surface-2)}
.oc-img img{width:100%;height:100%;object-fit:cover;display:block}
.oc .t{font-weight:800;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc .fit{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .fit svg{flex:none;color:var(--brand)}
.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--accent-soft);border-radius:14px}
.offer-price,.was-price{display:flex;flex-direction:column;gap:3px;min-width:0}
.offer-price small,.was-price small{font-size:10px;font-weight:700;color:var(--accent-hover)}
.offer-price span{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.offer-price b{font:700 24px/1 var(--f-num);letter-spacing:-.03em;color:var(--ink)}
.offer-price em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-2)}
.was-price{text-align:end}
.was-price small{color:var(--ink-3)}
.was-price s{font:500 13px/1 var(--f-num);color:var(--ink-2);white-space:nowrap}
.offer-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.ends{font-size:11px;color:var(--accent-hover);font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.seller{font-size:10.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seller svg{flex:none;color:var(--brand)}
.add{min-height:42px;border-radius:13px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.add:hover{background:var(--brand-deep)}
.add.in{background:var(--brand-soft);color:var(--brand)}

/* services */
.types{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.types::-webkit-scrollbar{display:none}
.type{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:11.5px;color:var(--ink-2);text-align:center;line-height:1.3}
.type span:first-child{width:56px;height:52px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--brand);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.svcs{display:flex;flex-direction:column;gap:10px;padding:12px 16px 0}
.sc{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-xs)}
.sc img{width:60px;height:60px;border-radius:14px;object-fit:cover;display:block}
.sc b{display:block;font-size:14px}
.sc .m{font-size:12px;color:var(--ink-3)}
.wa{min-height:40px;padding:0 12px;border-radius:14px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}

/* floating bottom nav */
.nav{position:absolute;inset-inline:12px;bottom:12px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:var(--shadow);z-index:10}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:11px;color:var(--ink-3);border-radius:18px}
.nav button[aria-current=page]{color:var(--brand);font-weight:700;background:var(--brand-soft)}

.toast{position:absolute;inset-inline:16px;bottom:96px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:13.5px;z-index:20;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- v9: compact hanging banner, search card, one finder for car and VIN, roadside card ---------- */
:root{--road:#001F3F; --road-ink:#FFFFFF; --road-ink-2:rgba(255,255,255,.74)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--road:#24302C}}
:root[data-theme="dark"]{--road:#24302C}
.band{padding-bottom:62px}
.bnr{margin-top:-50px}
.slide{min-height:118px;aspect-ratio:3 / 1;padding:0}
.slide .st1{font-size:16px}
.slide img{width:100%;height:100%;border-radius:0}
.slide .cta{margin-top:11px}
.card9{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px 16px 16px;box-shadow:var(--shadow-xs)}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:3px 10px 3px 12px;border-radius:999px;margin-bottom:8px}
.eyebrow i{width:8px;height:7px;background:var(--brand);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.card9 .hero-t{font-size:25px}
.card9 .hero-s{margin-bottom:12px}
.xl8{min-height:66px;align-content:flex-start;margin-top:12px}
.try{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:2px}
.try::-webkit-scrollbar{display:none}
.try > span{font-size:12px;color:var(--ink-3);flex:none}
.try button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--ink)}
.try button:hover{border-color:var(--brand);color:var(--brand)}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.fhead h2{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0;line-height:1.3}
.tabs2{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:3px;flex:none}
.tabs2 button{border:0;background:none;border-radius:11px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.tabs2 button[aria-selected=true]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-xs)}
.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.step .n{width:30px;height:27px;display:grid;place-items:center;font:700 12px/1 var(--f-num);background:var(--surface-2);color:var(--ink-3);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.step.done .n{background:var(--brand);color:var(--on-brand)}
.step.now .n{background:var(--accent);color:var(--accent-ink)}
.step .lab{font-size:12px;color:var(--ink-3);line-height:27px}
.step.done .lab{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink);font-weight:700;font-size:14px}
.step.done .lab button{border:0;background:none;color:var(--brand);font-size:12px;font-weight:700;padding:0}
.step.todo{opacity:.55}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink)}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
.chips.yr button{font-family:var(--f-num);font-weight:600}
.fgo{margin-top:14px;width:100%;min-height:48px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.fgo:hover{background:var(--accent-hover)}
.fgo[aria-disabled=true]{background:var(--surface-2);color:var(--ink-3);cursor:default}
.vinbox{background:var(--plate);border:1px solid var(--plate-line);border-radius:14px;padding:8px 28px 10px;position:relative;direction:ltr}
.vinbox::before,.vinbox::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--rivet)}
.vinbox::before{left:10px}.vinbox::after{right:10px}
.vinbox small{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;color:var(--ink-3);font-family:var(--f-num)}
.vinbox input{width:100%;border:0;background:transparent;outline:none;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:2px 0 0}
.vinbox:focus-within{border-color:var(--brand)}
.vhelp{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-top:8px}
.vhelp button{border:0;background:none;color:var(--brand);font-weight:700;font-size:12px;padding:0;flex:none}
.honest{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.honest svg{flex:none;margin-top:2px;color:var(--brand)}
.trust{padding-top:14px}
.oc{flex-basis:242px}
.road{margin:28px 16px 0;border-radius:26px;padding:18px 16px 16px;background:var(--road);color:var(--road-ink);position:relative;overflow:hidden}
.road > *{position:relative;z-index:1}
.road .ey{font-size:12px;font-weight:700;color:var(--mint)}
.road h2{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.3;margin:2px 0 4px}
.road p{margin:0 0 14px;color:var(--road-ink-2);font-size:13px}
.road .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.road .type{width:auto;color:var(--road-ink-2)}
.road .type span:first-child{background:rgba(255,255,255,.1);border:0;color:var(--mint);width:54px;height:48px}
.road .all{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.road .all span{font-size:12px;color:var(--road-ink-2)}
.road .all button{border:0;background:var(--mint);color:#001F3F;font-weight:700;font-size:12.5px;border-radius:999px;padding:7px 14px}
.svcs{padding-top:12px}
.fhead{flex-direction:column;align-items:stretch}
.tabs2 button{flex:1}
.rolepill{white-space:nowrap}

/* v10: the search card hangs off the band; the banner sits under it */
.band{padding-bottom:58px}
.hero9{margin-top:-46px;position:relative;z-index:2;box-shadow:var(--shadow)}
.bnr{margin:14px 16px 0}

/* v11: band mark, slimmer trust row, offer countdown, alive moments */

.hdr,.loc{z-index:5}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:16px 16px 0;padding:8px 4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-xs)}
.trust div{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;min-height:84px;background:none;border-radius:0;padding:6px 8px;color:var(--ink-2);font-size:11px;font-weight:700;line-height:1.45;border-inline-start:1px solid var(--line);min-width:0}
.trust div:first-child{border-inline-start:0}
.trust .trust-icon{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:12px;background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 1px 0 rgba(255,255,255,.46)}
.trust .trust-icon svg{width:19px;height:19px}
.sh{padding-bottom:4px}
.cd{margin:0 16px 10px;font-size:12px;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:6px}
.cd b{font-size:13px;letter-spacing:.02em}
.xl8 .said{position:relative}
.xl8 .said::after{content:"";position:absolute;inset-inline:0;bottom:-3px;height:3px;border-radius:2px;background:var(--accent)}
.dots button[aria-current=true]{position:relative;overflow:hidden;background:var(--line)}
.dots button[aria-current=true]::after{content:"";position:absolute;inset:0;background:var(--brand)}
.oc-img img{transition:transform .35s ease}
.oc-open:hover .oc-img img{transform:scale(1.04)}
.add{transition:transform .12s ease}
.add:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){
  .xl8 .said::after{transform-origin:right;animation:under .45s .1s ease-out both}
  @keyframes under{from{transform:scaleX(0)}}
  .dots button[aria-current=true]::after{transform-origin:right;animation:fill 5.2s linear both}
  @keyframes fill{from{transform:scaleX(0)}}
  .dot.bump{animation:bump .5s ease-out}
  @keyframes bump{40%{transform:scale(1.4)}}
  .add.in{animation:okpop .35s ease-out}
  @keyframes okpop{50%{transform:scale(1.04)}}
}
.band{overflow:clip}
/* Spary current identity: navy trust layer + orange action layer */
:root{
  --ground:#E8EEF4; --bg:#F7F9FC; --surface:#FFFFFF; --surface-2:#EDF3F9; --line:#C4D0DC;
  --ink:#001F3F; --ink-2:#45566B; --ink-3:#718398;
  --brand:#001F3F; --brand-deep:#173B5D; --brand-soft:#E8F0F7; --mint:#FF851B;
  --band:#001F3F; --band-ink:#FFFFFF; --band-ink-2:#D8E4EE; --hex:rgba(255,255,255,.07);
  --accent:#FF851B; --accent-hover:#D96D00; --accent-ink:#001F3F; --accent-soft:#FFF0DF;
  --plate:#E4ECF3; --plate-line:#B6C7D6; --rivet:#718398;
  --slide-1:#173B5D; --slide-2:#001F3F; --slide-3:#B54700; --on-slide:#FFFFFF;
  --on-brand:#FFFFFF; --ok:#0B7A53; --scrim:rgba(0,31,63,.5);
  --shadow:0 1px 2px rgba(0,31,63,.06),0 10px 28px rgba(0,31,63,.10); --shadow-xs:0 1px 2px rgba(0,31,63,.06);
  --road:#001F3F; --road-ink:#FFFFFF; --road-ink-2:rgba(255,255,255,.74);
  --f-display:"Alexandria","Noto Kufi Arabic",Tahoma,sans-serif;
  --f-body:"Noto Kufi Arabic",Tahoma,sans-serif;
  --f-num:"Poppins","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#071726; --bg:#0B2238; --surface:#102A43; --surface-2:#173B5D; --line:#2E4B63;
  --ink:#E9F1F8; --ink-2:#C2D0DD; --ink-3:#9BAEC0;
  --brand:#9BC7EF; --brand-deep:#173B5D; --brand-soft:#173B5D; --mint:#FFB76B;
  --band:#00152A; --band-ink:#FFFFFF; --band-ink-2:#CFE0ED; --hex:rgba(255,255,255,.06);
  --accent:#FF9C45; --accent-hover:#FFB66E; --accent-ink:#001F3F; --accent-soft:#4A2C18;
  --plate:#1C3349; --plate-line:#3D5C73; --rivet:#6F8799;
  --slide-1:#173B5D; --slide-2:#102A43; --slide-3:#8A3A12; --on-slide:#FFFFFF;
  --on-brand:#001F3F; --ok:#5CC48C; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --road:#00152A; --road-ink:#FFFFFF; --road-ink-2:rgba(255,255,255,.74);
}}
:root[data-theme="dark"]{
  --ground:#071726; --bg:#0B2238; --surface:#102A43; --surface-2:#173B5D; --line:#2E4B63;
  --ink:#E9F1F8; --ink-2:#C2D0DD; --ink-3:#9BAEC0;
  --brand:#9BC7EF; --brand-deep:#173B5D; --brand-soft:#173B5D; --mint:#FFB76B;
  --band:#00152A; --band-ink:#FFFFFF; --band-ink-2:#CFE0ED; --hex:rgba(255,255,255,.06);
  --accent:#FF9C45; --accent-hover:#FFB66E; --accent-ink:#001F3F; --accent-soft:#4A2C18;
  --plate:#1C3349; --plate-line:#3D5C73; --rivet:#6F8799;
  --slide-1:#173B5D; --slide-2:#102A43; --slide-3:#8A3A12; --on-slide:#FFFFFF;

body{background:var(--ground);padding:0;min-height:100dvh}
.stage{display:block;max-width:400px;margin:0 auto}
.device{width:100%;max-width:400px;height:100dvh;min-height:600px;border:0;border-radius:0;box-shadow:none}
.panel{display:none}
.logo{background:#FFFFFF;border-radius:12px;padding:4px 8px;flex:none}
.logo img{display:block;width:112px;height:32px;object-fit:contain}

/* Refined header: a quiet navy identity shelf with a clear location control */
.band{padding-bottom:64px;border-radius:0 0 28px 28px;box-shadow:0 14px 28px rgba(0,31,63,.18)}
.band::before{width:280px;height:240px;inset-inline-end:-112px;top:-74px;opacity:.09}
.hdr{min-height:70px;gap:10px;padding: max(14px, env(safe-area-inset-top, 0px)) 16px 12px;margin:0 -16px;background:rgba(0,31,63,.78);}
.logo{min-height:44px;border-radius:15px;padding:5px 10px;background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.72);box-shadow:0 7px 18px rgba(0,0,0,.14)}
.logo img{width:112px;height:32px}
.ibtn{width:46px;height:46px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);color:var(--mint);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ibtn:hover{background:rgba(255,255,255,.15)}
.rolepill{height:40px;border-radius:13px;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.09);font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.rolepill svg:first-child{color:var(--mint)}
.signup{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 11px;border:1px solid rgba(255,183,107,.48);border-radius:13px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;white-space:nowrap;box-shadow:0 6px 14px rgba(255,133,27,.2);transition:background .2s,transform .2s}
.signup:hover{background:var(--accent-hover);transform:translateY(-1px)}
.signup:focus-visible{outline:2px solid #fff;outline-offset:3px}
.signup svg{width:17px;height:17px;flex:none}
.loc{width:100%;min-height:44px;margin-top:10px;padding:0 12px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);font-size:12.5px}
.loc > svg:first-child{color:var(--mint)}
.loc > svg:last-child{margin-inline-start:auto;color:var(--band-ink-2)}
.loc b{font-weight:800}

/* Refined vehicle-fitment card */
#finder{margin-top:16px;border-radius:22px;padding:18px 16px 16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,31,63,.08)}
#finder .fhead{display:flex;flex-direction:column;align-items:stretch;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
#finder .find-title{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1.35;color:var(--ink)}
#finder .find-icon{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:13px;background:var(--brand);color:var(--on-brand);box-shadow:0 6px 14px rgba(0,31,63,.16)}
#finder .find-icon svg{width:19px;height:19px}
#finder .tabs2{width:100%;display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
#finder .tabs2 button{min-height:40px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:background .2s,color .2s,box-shadow .2s}
#finder .tabs2 button[aria-selected=true]{background:var(--brand);color:var(--on-brand);box-shadow:0 4px 10px rgba(0,31,63,.14)}
#finder .steps{position:relative;gap:0;margin:0}
#finder .steps::before{content:"";position:absolute;top:18px;bottom:18px;right:15px;width:2px;background:var(--line)}
#finder .step{position:relative;z-index:1;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:9px 0}
#finder .step > div{min-width:0;padding-top:2px}
#finder .step .n{width:32px;height:32px;border-radius:11px;clip-path:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:12px}
#finder .step.done .n{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
#finder .step.now .n{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 10px rgba(255,133,27,.24)}
#finder .step .lab{font-size:12px;line-height:32px;color:var(--ink-3)}
#finder .step.done .lab{font-size:13.5px;line-height:32px;color:var(--ink);font-weight:800}
#finder .step.now .lab{font-size:13px;line-height:1.5;color:var(--ink);font-weight:700}
#finder .step.done .lab button{padding:4px 0;font-size:11.5px;color:var(--brand)}
#finder .step.todo{opacity:.48}
#finder .step .chips{margin-top:8px;padding:0 0 2px;gap:7px}
#finder .step .chips button{height:38px;padding:0 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink);box-shadow:0 1px 2px rgba(0,31,63,.04)}
#finder .step .chips button:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
#finder .fgo{margin-top:16px;min-height:50px;border-radius:14px;font-size:13.5px;box-shadow:0 7px 16px rgba(255,133,27,.18)}
#finder .fgo[aria-disabled=true]{box-shadow:none}
#finder .vinbox{border-radius:14px;background:var(--surface-2);border-color:var(--line)}
#finder .vhelp{padding:0 2px}
#finder .honest{margin:12px 0 0;padding:9px 10px;border-radius:12px;background:var(--surface-2)}

/* VIN mode: keep every control in one calm, readable stack */
#finder .vin-panel{display:flex;flex-direction:column;gap:12px}
#finder .vin-panel .vinbox{width:100%;margin:0;padding:11px 30px 12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
#finder .vin-panel .vinbox::before,#finder .vin-panel .vinbox::after{display:none}
#finder .vin-panel .vinbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,133,27,.14)}
#finder .vin-panel .vinbox small{font-size:10px;letter-spacing:.16em;line-height:1.4}
#finder .vin-panel .vinbox input{height:38px;text-align:center;font-size:18px;letter-spacing:.16em;padding:6px 0 0}
#finder .vin-panel .vhelp{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;min-height:36px;font-size:11.5px;line-height:1.45}
#finder .vin-panel .vhelp span{min-width:0;color:var(--ink-3)}
#finder .vin-panel .vhelp button{flex:none;min-height:34px;padding:0 10px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:11.5px}
#finder .vin-panel .fgo{margin-top:0}
#finder .vin-panel .honest{display:flex;gap:7px;align-items:flex-start;margin:0;padding:9px 10px;border-radius:12px;background:var(--surface-2);font-size:11px;line-height:1.55;color:var(--ink-2)}
#finder .vin-panel .honest svg{flex:none;margin-top:2px;color:var(--brand)}

/* Refined promotional banner: a clear copy zone, calmer crop, and one decisive action */
.bnr{margin:16px 16px 0}
.bnr-track{border:1px solid rgba(0,31,63,.12);border-radius:20px;box-shadow:0 8px 22px rgba(0,31,63,.14)}
.slide{min-height:146px;aspect-ratio:2.35 / 1;border-radius:20px;isolation:isolate}
.slide::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(0,31,63,0) 22%,rgba(0,31,63,.22) 47%,rgba(0,31,63,.94) 100%);pointer-events:none}
.slide .slide-copy{position:absolute;top:0;right:0;bottom:0;z-index:2;width:min(55%,230px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;padding:17px 16px 16px 14px;text-align:right}
.slide .st1{font-size:15px;line-height:1.45;margin:0 0 5px;text-wrap:balance}
.slide .st2{font-size:10.75px;line-height:1.55;opacity:.9}
.slide .cta{align-self:flex-start;min-height:32px;margin-top:11px;padding:6px 11px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;box-shadow:0 5px 12px rgba(0,0,0,.16)}
.slide .cta svg{width:14px;height:14px}
.slide img{object-position:left center}
.slide .ad{display:none}
@media (max-width:360px){
  .slide{min-height:138px}
  .slide .slide-copy{width:58%;padding:14px 13px 13px 12px}
  .slide .st1{font-size:14px}
  .slide .st2{font-size:10.25px}
  .slide .cta{min-height:30px;margin-top:8px;padding:5px 9px;font-size:11px}
}

/* Cinematic roadside services: a dark scene with focused service controls */
.road{margin:30px 16px 0;padding:22px 16px 16px;border:1px solid rgba(255,255,255,.14);border-radius:26px;box-shadow:0 16px 30px rgba(0,31,63,.2);isolation:isolate}
.road::before{content:"";position:absolute;width:230px;height:180px;inset-inline-end:-94px;top:-86px;border-radius:50%;background:radial-gradient(circle,rgba(255,133,27,.3),rgba(255,133,27,0) 68%);opacity:.65;pointer-events:none}
.road .ey{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.02em;color:#ffb76b}
.road .ey::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--accent)}
.road h2{font-size:26px;line-height:1.25;margin:7px 0 6px;letter-spacing:-.02em}
.road p{max-width:30ch;margin:0;color:rgba(255,255,255,.74);font-size:12.5px;line-height:1.7}
.road .road-loc{display:inline-block;margin-inline-start:4px;padding:1px 7px;border:1px solid rgba(255,133,27,.35);border-radius:7px;color:#ffd0a4;background:rgba(255,133,27,.1);font-weight:700}
.road .grid4{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}
.road .type{min-height:66px;flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 11px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.075);color:var(--road-ink);text-align:right;transition:background .2s,border-color .2s,transform .2s}

function parse(text){
  const t = ' ' + norm(text) + ' ', r = {text, part:null, typed:null, amb:[], mk:null, md:null, year:null, oem:null};
  let best = 0, hits = [];
  NAMES.forEach(x => [x.name, ...x.alt].forEach(al => { const n = norm(al); if (n.length >= 2 && (n.length > 3 ? t.includes(n) : t.includes(' ' + n + ' '))){ if (n.length > best){ best = n.length; hits = [[x.id, al]]; } else if (n.length === best && !hits.some(h => h[0] === x.id)) hits.push([x.id, al]); } }));
  if (hits.length === 1){ r.part = hits[0][0]; r.typed = hits[0][1]; } else if (hits.length > 1){ r.amb = hits.map(h => h[0]); r.typed = hits[0][1]; }
  MAKES.forEach(m => { if (t.includes(norm(m.name))) r.mk = m.id; m.models.forEach(md => [md.name, ...md.alt].forEach(al => { if (t.includes(' ' + norm(al) + ' ')){ r.mk = m.id; r.md = md.id; } })); });
  const y = text.match(/\b(19[89]\d|20[0-2]\d)\b/); if (y) r.year = +y[1];
  const o = text.match(/\b[A-Z0-9]{4,6}-[A-Z0-9]{3,6}\b/i); if (o) r.oem = o[0].toUpperCase();
  return r;
}

function xl8(r, live){
  if (!r || !r.text.trim()) return '';
  const out = [];
  if (r.part){ if (norm(r.typed) !== norm(nm(r.part).name)) out.push(`<span class="said">${esc(r.typed)}</span><span class="arr" aria-hidden="true">←</span>`); out.push(`<span class="pill part">${nm(r.part).name}</span>`); }
  else if (r.amb.length){ out.push(`<span class="said">${esc(r.typed)}</span><span class="arr" aria-hidden="true">←</span><span class="lbl">أمامية ولا خلفية؟</span>`); r.amb.forEach(id => out.push(`<span class="pill car">${nm(id).name}</span>`)); }
  if (r.mk) out.push(`<span class="pill car">${carName(r.mk, r.md)}</span>`);
  if (r.year) out.push(`<span class="pill car num">${r.year}</span>`);
  if (r.oem) out.push(`<span class="lbl">رقم OEM</span><span class="pill oem ltr">${r.oem}</span>`);
  if (!out.length && live) out.push(`<span class="lbl">ما عرفنا الاسم بعد. جرّب اسمًا ثانيًا للقطعة أو رقم OEM.</span>`);
  return out.join('');
}

/* ---------- the translating search ---------- */
let loopT, loopOn = false;
const sleep = ms => new Promise(r => { loopT = setTimeout(r, ms); });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
async function loop(){
  if (loopOn) return; loopOn = true;
  const g = document.getElementById('ghost'), x = document.getElementById('xl8');
  if (reduce){ g.innerHTML = esc(EXAMPLES[0]); x.innerHTML = xl8(parse(EXAMPLES[0])); return; }
  for (let k = 0; H.typing; k = (k + 1) % EXAMPLES.length){
    const ex = EXAMPLES[k];
    for (let i = 1; i <= ex.length && H.typing; i++){ g.innerHTML = esc(ex.slice(0, i)) + '<i></i>'; await sleep(75); }
    if (!H.typing) break;
    x.innerHTML = xl8(parse(ex)); await sleep(2300);
    for (let i = ex.length; i >= 0 && H.typing; i--){ g.innerHTML = esc(ex.slice(0, i)) + '<i></i>'; await sleep(22); }
    if (H.typing) x.innerHTML = ''; await sleep(350);
  }
  loopOn = false;
}
const HINT = 'اسم القطعة، اسمها الشعبي، أو رقم OEM';
function stopLoop(){ H.typing = false; clearTimeout(loopT); loopOn = false; }
function wire(){
  const q = document.getElementById('q'), g = document.getElementById('ghost'), x = document.getElementById('xl8');
  q.addEventListener('focus', () => { stopLoop(); x.setAttribute('aria-live', 'polite'); x.innerHTML = xl8(parse(q.value), true); g.innerHTML = q.value ? '' : HINT; });
  q.addEventListener('input', () => { g.innerHTML = q.value ? '' : HINT; x.innerHTML = xl8(parse(q.value), true); });
  q.addEventListener('blur', () => { if (!q.value.trim()){ x.removeAttribute('aria-live'); x.innerHTML = ''; H.typing = true; setTimeout(() => { if (H.typing && document.activeElement !== q) loop(); }, 900); } });
  document.getElementById('sform').addEventListener('submit', e => { e.preventDefault(); q.value.trim() ? toast('صفحة النتائج بتنصمّم بعد ما تعتمد الرئيسية') : q.focus(); });
  const tr = document.getElementById('bnr');
  tr.addEventListener('scroll', () => { const i = Math.round(Math.abs(tr.scrollLeft) / tr.clientWidth); if (i !== H.slide){ H.slide = i; document.querySelectorAll('.dots button').forEach((d, k) => d.toggleAttribute('aria-current', k === i)); } }, {passive:true});
  if (H.typing) loop();
}
function goSlide(i){ const tr = document.getElementById('bnr'); const dir = getComputedStyle(tr).direction === 'rtl' ? -1 : 1; tr.scrollTo({left: dir * i * tr.clientWidth, behavior: reduce ? 'auto' : 'smooth'}); }
setInterval(() => { if (reduce || document.hidden) return; const tr = document.getElementById('bnr'); if (!tr || tr.matches(':hover')) return; goSlide((H.slide + 1) % SLIDES.length); }, 5200);

  if (act === 'role') toast('قائمة الصفات متل الإصدار 3: أتسوّق لنفسي · أدير متجري · أطلب من مورّد');
  if (act === 'theme'){ H.theme = arg; if (arg === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = arg; panel(); }
  if (act === 'persona'){ H.persona = arg; stopLoop(); H.typing = true; render(); }
});

  const seg = (act, cur, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-h="${act}|${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;
  document.getElementById('panel').innerHTML = `<div><h1>الرئيسية — الإصدار 11</h1><p style="color:var(--ink-2);margin-top:4px">الرئيسية وحدها. بقية الصفحات بعد اعتمادها.</p></div>
    <div class="pbox"><h2>الإصدارات</h2><ul class="vers"><li><span class="cur">v11 <small>الحالي</small></span></li>${VERS.map(([href, v, d]) => `<li><a href="${href}">${v} <small>${d}</small></a></li>`).join('')}</ul></div>
    <div class="pbox"><h2>المظهر</h2>${seg('theme', H.theme, [['auto','حسب الجهاز'],['light','فاتح'],['dark','داكن']])}</div>
    <div class="pbox"><h2>حالة الحساب</h2>${seg('persona', H.persona, [['guest','ضيف'],['multi','زبون عنده متجر']])}</div>
    <div class="pbox"><h2>بنود الوثيقة في هذه الصفحة</h2><ul class="refs">${refs.map(([c, t]) => `<li><code>${c}</code><span>${t}</span></li>`).join('')}</ul></div>
    <p class="pnote">البيانات أمثلة: المحلات والأسعار وأرقام الشاسيه ومحتوى البانرات. الصور رسوم بديلة تحاكي تصوير التاجر بالموبايل.</p>`;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && H.toast){ H.toast = null; paintToast(); } });

/* ---------- countdown to the soonest offer end (example: tonight 23:59) ---------- */
function cdText(){ const now = new Date(), end = new Date(now); end.setHours(23, 59, 59, 0); const t = Math.max(0, Math.floor((end - now) / 1000));
  return [Math.floor(t / 3600), Math.floor(t % 3600 / 60), t % 60].map(n => String(n).padStart(2, '0')).join(':'); }
setInterval(() => { const el = document.getElementById('cd'); if (el) el.textContent = cdText(); }, 1000);
render();
</script>
