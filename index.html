  <meta name="theme-color" content="#111c20">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <main class="presentation" aria-label="معاينة تطبيق Spary">

      <div id="app" class="app">
        <div id="screen" class="screen"></div>
